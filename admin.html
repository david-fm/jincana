<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jincana - Modo Creación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Jincana</h1>
      <p>Crea y organiza las localizaciones de tu jincana</p>
    </header>

    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab">Jugar</a>
      <a href="admin.html" class="nav-tab active">Crear</a>
    </nav>

    <!-- Estadísticas -->
    <div class="admin-stats" id="admin-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-count">0</div>
        <div class="stat-label">Localizaciones</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-distance">—</div>
        <div class="stat-label">Distancia total</div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="card">
      <div class="card-title">Nueva localización</div>
      <div class="map-container" id="admin-map"></div>
      <form class="admin-form" id="location-form" onsubmit="return false;">
        <input type="hidden" id="loc-id">
        <div class="form-group">
          <label class="form-label" for="loc-pista">Pista</label>
          <textarea class="form-textarea" id="loc-pista" rows="3" placeholder="Escribe la pista que guiará al jugador a esta localización..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Coordenadas (haz clic en el mapa)</label>
          <div style="display: flex; gap: 0.75rem;">
            <input type="text" class="form-input" id="loc-lat" placeholder="Latitud" readonly>
            <input type="text" class="form-input" id="loc-lng" placeholder="Longitud" readonly>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="loc-radio">Radio de llegada (metros)</label>
          <input type="number" class="form-input" id="loc-radio" value="20" min="5" max="500">
        </div>
        <div class="form-group">
          <label class="form-label" for="loc-password">Contraseña de la pista (opcional)</label>
          <input type="text" class="form-input" id="loc-password" placeholder="Deja vacío si no requiere contraseña">
        </div>
        <div class="admin-form-actions">
          <button type="button" class="btn btn-primary" id="btn-save" onclick="saveLocation()">
            <span>Guardar localización</span>
          </button>
          <button type="button" class="btn btn-ghost hidden" id="btn-cancel" onclick="cancelEdit()">
            <span>Cancelar</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Toolbar -->
    <div class="admin-toolbar">
      <button class="btn btn-outline btn-sm" onclick="exportJincana()">
        <span>Exportar .jincana</span>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="clearAll()">
        <span>Borrar todo</span>
      </button>
    </div>

    <!-- Lista -->
    <div class="card">
      <div class="card-title">Localizaciones</div>
      <div class="locations-list" id="locations-list">
        <div class="list-empty">
          <div class="list-empty-icon">📍</div>
          <p>Aún no has añadido localizaciones</p>
          <p class="mt-1" style="font-size: 0.85rem;">Haz clic en el mapa y rellena los datos</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal compartido -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">Título</div>
      <div class="modal-text" id="modal-text">Texto del modal</div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-btn-confirm">Confirmar</button>
        <button class="btn btn-ghost" id="modal-btn-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/utils.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
